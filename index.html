<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf7ff">
<title>注音發聲板</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;overflow-x:hidden}
body{background:#eaf7ff;color:#102f4b;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{width:100%;max-width:1500px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.panel{background:white;border-radius:20px;padding:12px;flex:0 0 auto}
.top{display:flex;align-items:stretch;gap:8px}
#sentence{flex:1;min-width:0;min-height:72px;padding:10px 13px;border:3px solid #8bd2ff;border-radius:16px;background:#fbfdff;color:#000;font-size:clamp(24px,3vw,37px);font-weight:900;overflow-wrap:anywhere}
.big{flex:0 0 auto;min-width:82px;border:0;border-radius:14px;padding:10px;font-size:clamp(22px,2.6vw,31px);font-weight:900;touch-action:manipulation}
#speak{background:#ffd45c}#clear{background:#ffcaca;color:#0066ca}
.label{font-size:clamp(17px,2vw,23px);font-weight:900;margin:8px 0 6px}
#favorites{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.fav{min-width:0;min-height:56px;padding:4px 2px;border:2px dashed #73c8ff;border-radius:12px;background:#fff7ce;color:#0874dc;font-size:clamp(17px,2vw,25px);font-weight:900;overflow-wrap:anywhere;touch-action:manipulation}
#compose{min-height:39px;padding:2px 4px;color:#000;font-size:clamp(27px,3vw,40px);font-weight:900}
#cands{display:flex;align-items:center;gap:6px;min-height:48px;padding:3px 0;overflow-x:auto;scrollbar-width:thin}
.cand{flex:0 0 auto;min-width:48px;min-height:44px;border:2px solid #a8d9f7;border-radius:10px;background:#fff;color:#0759b3;font-size:clamp(23px,2.7vw,34px);font-weight:900;padding:4px 8px}
.keyboard{background:#dff3ff;border-radius:20px;padding:8px;flex:0 0 auto}
#keys{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:6px}
.key{width:100%;min-width:0;height:clamp(56px,9vh,90px);padding:0;border:0;border-radius:12px;background:#fff;color:#0874dc;box-shadow:0 2px 5px #00000012;font-family:inherit;font-size:clamp(28px,3.8vw,45px);font-weight:900;line-height:1;touch-action:manipulation}
.key.tone{background:#ffe99b}.key.action{background:#bce9c8;font-size:clamp(21px,3vw,30px)}
.blank{visibility:hidden}.one-tone-wrap{grid-column:2 / span 7;min-width:0;display:flex}
.one-tone{height:100%;width:100%;border:2px solid #cfd8df;border-radius:12px;background:#fff;display:flex;justify-content:center;align-items:center;touch-action:manipulation}
.one-tone-dot{width:clamp(30px,5vh,53px);height:clamp(30px,5vh,53px);border-radius:50%;background:#e21b16}
footer{text-align:center;color:#587891;font-size:clamp(13px,1.6vw,19px);padding:4px 3px;font-weight:700}
footer .source{display:block;font-size:clamp(11px,1.2vw,14px);font-weight:400;line-height:1.4;margin-top:4px}
@media(min-width:601px){
 main{height:100dvh;min-height:0;overflow:hidden}
 .panel{padding:clamp(6px,1vh,12px)}
 #sentence{min-height:clamp(52px,8vh,90px)}
 .fav{min-height:clamp(40px,6vh,62px)}
 .keyboard{flex:1 1 auto;min-height:0;display:flex}
 #keys{flex:1;min-height:0;gap:clamp(3px,.7vh,7px)}
 .key{height:100%;font-size:clamp(26px,4.5vh,47px)}
 .one-tone{height:100%}
 footer{flex:0 0 auto}
}
@media(max-width:600px){
 main{height:100dvh;min-height:0;overflow:hidden;padding:6px;gap:6px;justify-content:flex-start}
 .panel{padding:8px 7px;border-radius:16px}
 .top{gap:5px}
 #sentence{min-height:57px;padding:7px 9px;font-size:clamp(20px,5.3vw,27px);border-radius:12px}
 .big{min-width:0;padding:5px 7px;font-size:clamp(18px,4.6vw,24px);border-radius:12px}
 .label{font-size:clamp(15px,3.8vw,19px);margin:6px 0 5px}
 #favorites{gap:3px}
 .fav{min-height:clamp(43px,6.7vh,58px);font-size:clamp(14px,3.6vw,18px);border-radius:10px}
 #compose{min-height:32px;font-size:clamp(25px,6.5vw,32px)}
 #cands{min-height:47px;gap:4px}
 .cand{min-width:45px;min-height:42px;font-size:clamp(22px,5.7vw,28px);padding:3px 6px}
 .keyboard{padding:6px 5px;border-radius:15px;flex:0 0 auto}
 #keys{gap:3px;grid-template-rows:repeat(5,clamp(37px,9.7vw,45px))}
 .key{height:100%;font-size:clamp(20px,5.6vw,27px);border-radius:8px}
 .key.action{font-size:20px}
 .one-tone-dot{height:29px;width:29px}
 footer{font-size:clamp(12px,3vw,15px);padding:2px 0}
 footer .source{font-size:clamp(10px,2.6vw,12px)}
}
@media(max-width:600px) and (max-height:700px){
 .panel{padding:5px}.label{margin:3px 0}.fav{min-height:36px}
 #cands{min-height:40px}.cand{min-height:36px}
 #keys{grid-template-rows:repeat(5,clamp(32px,8.4vw,39px))}
 footer .source{font-size:10px}
}
</style>
</head>
<body>
<main>
<section class="panel">
 <div class="top">
   <div id="sentence">請用下方注音開始輸入…</div>
   <button id="speak" class="big" aria-label="播放句子">🔊</button>
   <button id="clear" class="big">清除</button>
 </div>
 <div class="label">常用語（長按一格即可儲存目前句子）</div>
 <div id="favorites"></div>
 <div id="compose"></div>
 <div id="cands"></div>
</section>
<section class="keyboard"><div id="keys"></div></section>
<footer>國立臺南大學特教系 臧永佳 AI設計開發<span class="source">字音資料：教育部《國語辭典簡編本》（2026-09-29）；注音發音：教育部《國語注音符號手冊》（CC BY 4.0）</span></footer>
</main>
<script src="./zhuyin-dictionary.js?v=15.1"></script>
<script src="./app.js?v=15.1"></script>

</body>
</html>
