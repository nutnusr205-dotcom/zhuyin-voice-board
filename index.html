<!doctype html><html lang='zh-Hant'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#35aaf5'><link rel='manifest' href='manifest.webmanifest'><link rel='apple-touch-icon' href='icon-192.png'><title>注音發聲板</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:#eef8ff;color:#15304b;user-select:none}.app{max-width:1100px;margin:auto;padding:14px}.top{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 20px #b7d8ec66}.output{display:flex;gap:10px;align-items:center}.sentence{flex:1;min-height:68px;border:3px solid #9ed8fa;border-radius:16px;padding:12px;font-size:30px;background:#fbfeff}.speak,.clear{border:0;border-radius:16px;padding:16px;font-size:25px;background:#ffd45b}.clear{background:#ffd1d1}.label{font-weight:700;margin:12px 0 7px}.favorites{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.fav{min-height:58px;border:2px dashed #8bc7e8;border-radius:14px;background:#fff8cf;font-size:18px;padding:5px}.compose{font-size:27px;text-align:center;min-height:43px;margin-top:10px;color:#145c91}.cands{display:flex;gap:8px;overflow-x:auto;padding:8px 0}.cand{min-width:74px;padding:11px;border:0;border-radius:13px;background:#fff;font-size:25px;box-shadow:0 2px 8px #aac8da66}.keyboard{margin-top:10px;background:#dff3ff;border-radius:22px;padding:12px}.keys{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}.key{min-height:56px;border:0;border-radius:13px;background:white;font-size:27px;box-shadow:0 2px 7px #94bad055}.tone{background:#fff0a8}.action{background:#bce6c8;font-size:18px}.footer{text-align:center;margin:12px;font-size:16px;color:#58758b}@media(max-width:700px){.app{padding:7px}.sentence{font-size:23px;min-height:56px}.favorites{grid-template-columns:repeat(5,minmax(70px,1fr));overflow-x:auto}.keys{grid-template-columns:repeat(7,1fr)}.key{min-height:50px;font-size:23px}.speak,.clear{padding:12px;font-size:20px}}
</style></head><body><main class='app'><section class='top'><div class='output'><div id='sentence' class='sentence'>請用下方注音開始輸入…</div><button class='speak' id='speak'>🔊</button><button class='clear' id='clear'>清除</button></div><div class='label'>常用語（長按一格即可儲存目前句子）</div><div class='favorites' id='favorites'></div><div class='compose' id='compose'>　</div><div class='cands' id='cands'></div></section><section class='keyboard'><div class='keys' id='keys'></div></section><div class='footer'>國立臺南大學特教系 臧永佳 AI設計開發</div></main><script src='app.js'></script></body></html>
