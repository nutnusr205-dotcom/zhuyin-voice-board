<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf7ff">
<title>注音發聲板</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box}
body{margin:0;background:#eaf7ff;color:#102f4b;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:1440px;margin:auto;padding:12px 18px 8px}
.panel{background:#fff;border-radius:28px;padding:18px 18px 10px;margin-bottom:12px}
.top{display:flex;gap:12px;align-items:center}
#sentence{flex:1;min-height:88px;border:3px solid #8bd2ff;border-radius:22px;padding:18px;font-size:36px;background:#fbfdff}
.big{border:0;border-radius:20px;padding:20px 24px;font-size:28px;cursor:pointer}
#speak{background:#ffd45c} #clear{background:#ffcaca}
.label{font-weight:700;font-size:20px;margin:14px 0 8px}
#favorites{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.fav{min-height:72px;border:2px dashed #73c8ff;border-radius:20px;background:#fff7ce;font-size:24px}
#compose{min-height:42px;font-size:28px;padding:4px 8px}
#cands{display:flex;gap:8px;overflow-x:auto;min-height:0;padding:3px 0 2px}
.cand{min-width:66px;border:1px solid #a8d9f7;border-radius:14px;background:#fff;font-size:26px;padding:10px}
.keyboard{background:#dff3ff;border-radius:28px;padding:14px}
#keys{display:grid;grid-template-columns:repeat(12,minmax(58px,1fr));gap:8px}
.key{height:70px;border:0;border-radius:16px;background:#fff;box-shadow:0 4px 10px #00000012;font-size:34px;line-height:1;writing-mode:horizontal-tb;text-orientation:mixed;transform:none;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.key.tone{background:#ffe99b}
.key.action{background:#bce9c8;font-size:22px}
.blank{visibility:hidden}
.one-tone-wrap{grid-column:2 / span 7;display:flex;align-items:center;justify-content:center}
.one-tone{width:100%;height:72px;border:2px solid #cfd8df;border-radius:16px;background:#fff;box-shadow:0 4px 10px #00000010;display:flex;align-items:center;justify-content:center;cursor:pointer}
.one-tone-dot{width:54px;height:54px;border-radius:50%;background:#e21b16;display:block}
footer{text-align:center;font-size:19px;color:#587891;padding:12px 0 2px;font-weight:400}
@media(max-width:900px){
 main{padding:8px}.panel{padding:12px;border-radius:20px}
 #sentence{font-size:27px;min-height:72px}.big{font-size:22px;padding:16px}
 #favorites{gap:6px}.fav{font-size:18px;min-height:60px}
 #keys{grid-template-columns:repeat(12,minmax(42px,1fr));gap:5px}
 .key{height:58px;font-size:28px;border-radius:12px}
}
</style>
</head>
<body>
<main>
<section class="panel">
 <div class="top">
   <div id="sentence">請用下方注音開始輸入…</div>
   <button id="speak" class="big" aria-label="播放句子">🔊</button>
   <button id="clear" class="big">清除</button>
 </div>
 <div class="label">常用語（長按一格即可儲存目前句子）</div>
 <div id="favorites"></div>
 <div id="compose"></div>
 <div id="cands"></div>
</section>
<section class="keyboard"><div id="keys"></div></section>
<footer>國立臺南大學特教系 臧永佳 AI設計開發</footer>
</main>
<script src="./zhuyin-dictionary.js?v=10"></script>
<script src="./app.js?v=10"></script>
</body>
</html>
