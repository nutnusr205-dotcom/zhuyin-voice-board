<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf7ff">
<title>注音發聲板</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box}
body{margin:0;background:#eaf7ff;color:#102f4b;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:1440px;margin:auto;padding:12px 18px 8px}
.panel{background:#fff;border-radius:28px;padding:18px 18px 10px;margin-bottom:12px}
.top{display:flex;gap:12px;align-items:center}
#sentence{flex:1;min-width:0;min-height:88px;border:3px solid #8bd2ff;border-radius:22px;padding:18px;font-size:36px;font-weight:800;color:#000;background:#fbfdff}
.big{border:0;border-radius:20px;padding:20px 24px;font-size:28px;cursor:pointer}
#speak{background:#ffd45c} #clear{background:#ffcaca}
.label{font-weight:700;font-size:20px;margin:14px 0 8px}
#favorites{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.fav{min-height:72px;border:2px dashed #73c8ff;border-radius:20px;background:#fff7ce;font-size:24px}
#compose{min-height:42px;font-size:28px;padding:4px 8px;color:#000;font-weight:800}
#cands{display:flex;gap:8px;overflow-x:auto;min-height:0;padding:3px 0 2px}
.cand{min-width:66px;border:1px solid #a8d9f7;border-radius:14px;background:#fff;font-size:26px;font-weight:700;padding:10px}
.keyboard{background:#dff3ff;border-radius:28px;padding:14px}
#keys{display:grid;grid-template-columns:repeat(11,minmax(58px,1fr));gap:8px}
.key{height:70px;border:0;border-radius:16px;background:#fff;box-shadow:0 4px 10px #00000012;font-size:34px;font-weight:800;color:#0874dc;line-height:1;writing-mode:horizontal-tb;text-orientation:mixed;transform:none;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.key.tone{background:#ffe99b}
.key.action{background:#bce9c8;font-size:22px;color:#102f4b}
.blank{visibility:hidden}
.one-tone-wrap{grid-column:2 / span 7;display:flex;align-items:center;justify-content:center}
.one-tone{width:100%;height:72px;border:2px solid #cfd8df;border-radius:16px;background:#fff;box-shadow:0 4px 10px #00000010;display:flex;align-items:center;justify-content:center;cursor:pointer}
.one-tone-dot{width:54px;height:54px;border-radius:50%;background:#e21b16;display:block}
footer{text-align:center;font-size:19px;color:#587891;padding:12px 0 2px;font-weight:400}
@media(max-width:900px){
 main{width:100%;max-width:100%;padding:8px;overflow-x:hidden}
 .panel{padding:12px;border-radius:20px}
 #sentence{font-size:27px;min-height:72px}
 .big{font-size:22px;padding:16px}
 #favorites{gap:6px}
 .fav{font-size:18px;min-height:60px}
 .keyboard{width:100%;max-width:100%;padding:10px 8px;overflow:hidden}
 #keys{width:100%;min-width:0;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
 .key{width:100%;min-width:0;height:58px;padding:0;font-size:27px;border-radius:11px}
 .one-tone-wrap{min-width:0}
 .one-tone{min-width:0;height:60px}
 .one-tone-dot{width:46px;height:46px}
}
@media(max-width:480px){
 main{padding:5px 6px 6px}
 .panel{padding:10px 9px 8px;margin-bottom:8px;border-radius:20px}
 .top{gap:6px}
 #sentence{font-size:22px;min-height:64px;padding:10px 11px;border-radius:18px}
 .big{font-size:18px;padding:12px 10px;border-radius:17px}
 .label{font-size:17px;margin:11px 0 7px}
 #favorites{gap:4px}
 .fav{font-size:17px;min-height:54px;padding:2px;border-radius:16px}
 #compose{min-height:30px;font-size:24px;padding:2px 5px}
 #cands{gap:5px;padding:1px 0}
 .cand{min-width:54px;font-size:22px;padding:7px}
 .keyboard{padding:8px 5px;border-radius:22px}
 #keys{gap:4px}
 .key{height:58px;font-size:27px;border-radius:11px}
 .one-tone{height:60px}
 .one-tone-dot{width:46px;height:46px}
 footer{font-size:16px;padding:9px 0 1px}
}

/* v14.4: accessible touch targets on phones */
@media(max-width:600px){
 #keys{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
 .keyboard{padding:9px 7px;overflow:visible}
 .key{min-height:66px;height:66px;font-size:clamp(27px,7vw,35px);font-weight:900;color:#0874dc;border-radius:13px;touch-action:manipulation}
 .key.tone{color:#074b93}
 .key.action{font-size:22px;color:#102f4b}
 .blank{display:none}
 .one-tone-wrap{grid-column:span 5}
 .one-tone{height:66px}
 #sentence{font-weight:800;color:#000;overflow-wrap:anywhere}
 #compose{font-weight:900;color:#000;overflow-wrap:anywhere}
 .top{min-width:0}
 .big{flex-shrink:0}
}
@media(max-width:390px){
 #keys{gap:5px}
 .key{height:62px;min-height:62px;font-size:29px}
 .one-tone{height:62px}
}

/* v14.5: iPad and desktop use the same accessible six-column layout */
#keys{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.key{width:100%;min-width:0;height:94px;min-height:94px;font-size:clamp(34px,3.7vw,52px);font-weight:900;color:#0874dc;border-radius:18px;touch-action:manipulation}
.key.tone{color:#074b93}
.key.action{font-size:30px}
.blank{display:none}
.one-tone-wrap{grid-column:span 5;min-width:0}
.one-tone{height:94px}
.one-tone-dot{width:62px;height:62px}
#compose{color:#000;font-weight:900}
#sentence{color:#000;font-weight:900}
@media(max-width:900px) and (min-width:601px){
 #keys{grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}
 .key{height:90px;min-height:90px;font-size:44px}
 .one-tone{height:90px}
}
@media(max-width:600px){
 #keys{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
 .key{height:70px;min-height:70px;font-size:clamp(27px,7vw,35px)}
 .one-tone{height:70px}
 .one-tone-dot{width:46px;height:46px}
}
@media(max-width:390px){
 .key{height:64px;min-height:64px;font-size:29px}
 .one-tone{height:64px}
}

/* v14.6: one-screen layout on iPad landscape/portrait and desktop.
   Key dimensions follow viewport height while retaining accessible targets. */
@media(min-width:601px){
 html,body{height:100%;overflow:hidden}
 main{height:100dvh;max-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;gap:clamp(3px,.6vh,9px);padding:clamp(5px,.8vh,12px);overflow:hidden}
 .panel{flex:0 1 auto;min-height:0;margin-bottom:0;padding:clamp(7px,1vh,15px)}
 .top{gap:8px}
 #sentence{min-height:0;font-size:clamp(20px,2.6vh,36px);padding:clamp(7px,1vh,13px)}
 .big{font-size:clamp(17px,2.5vh,29px);padding:clamp(8px,1vh,14px)}
 .label{font-size:clamp(14px,1.8vh,21px);margin:clamp(4px,.8vh,10px) 0}
 #favorites{gap:7px}
 .fav{min-height:0;font-size:clamp(16px,2.3vh,26px);padding:clamp(6px,1vh,13px)}
 #compose{min-height:0;font-size:clamp(20px,2.6vh,30px);padding:3px 5px}
 #cands{gap:5px;padding:0}
 .cand{min-width:0;font-size:clamp(17px,2.2vh,25px);padding:clamp(4px,.7vh,8px)}
 .keyboard{flex:1 1 auto;min-height:0;padding:clamp(5px,.8vh,12px);overflow:hidden;display:flex}
 #keys{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));gap:clamp(3px,.7vh,9px)}
 .key{height:100%;min-height:0;font-size:clamp(23px,4vh,46px);border-radius:clamp(9px,1.4vh,17px)}
 .key.action{font-size:clamp(17px,2.8vh,28px)}
 .one-tone-wrap{min-height:0}
 .one-tone{height:100%;min-height:0}
 .one-tone-dot{width:clamp(28px,5vh,58px);height:clamp(28px,5vh,58px)}
 footer{flex:0 0 auto;font-size:clamp(12px,1.6vh,19px);padding:1px 0}
 footer small{font-size:clamp(10px,1.3vh,14px)}
}
@media(min-width:601px) and (max-height:680px){
 .panel{padding:5px 9px}
 .label{margin:2px 0}
 .fav{padding:4px}
 #compose{padding:0 5px}
 #keys{gap:3px}
}

/* v14.7: Restore original 11-column arrangement on iPad/desktop.
   Five rows, bold large keys, viewport-fit without page scrolling. */
@media(min-width:601px){
 #keys{grid-template-columns:repeat(11,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:clamp(4px,.8vh,9px)}
 .blank{display:block;visibility:hidden}
 .key{height:100%;min-height:0;min-width:0;padding:0;font-size:clamp(27px,4vh,45px);font-weight:900;color:#0874dc;border-radius:12px}
 .key.action{font-size:clamp(22px,3vh,30px)}
 .one-tone-wrap{grid-column:2 / span 7}
 .one-tone{height:100%;min-height:0}
 .keyboard{flex:1 1 auto;min-height:0}
}

/* v14.8: iPhone returns to 11 columns / five rows, no vertical keyboard scrolling. */
@media(max-width:600px){
 html,body{margin:0;min-height:100%;overflow-x:hidden}
 main{height:calc(100dvh - 30px);max-height:calc(100dvh - 30px);min-height:0;display:flex;flex-direction:column;gap:4px;padding:5px 5px 1px;overflow:hidden}
 .panel{flex:0 1 auto;min-height:0;margin:0;padding:7px 7px 4px;border-radius:14px}
 .top{gap:5px}
 #sentence{min-height:0;padding:7px;font-size:clamp(17px,2.8vh,23px);border-radius:12px;overflow-wrap:anywhere}
 .big{font-size:clamp(14px,2.3vh,18px);padding:8px 7px;border-radius:11px}
 .label{font-size:clamp(12px,1.9vh,15px);margin:5px 0 4px}
 #favorites{gap:3px}
 .fav{min-height:0;padding:4px 1px;font-size:clamp(12px,1.8vh,16px);border-radius:9px;overflow-wrap:anywhere}
 #compose{min-height:0;font-size:clamp(18px,2.5vh,24px);padding:2px 3px}
 #cands{gap:3px;padding:1px 0}
 .cand{min-width:40px;font-size:clamp(16px,2.3vh,21px);padding:3px}
 .keyboard{flex:1 1 auto;min-height:0;display:flex;overflow:hidden;padding:5px 3px;border-radius:14px}
 #keys{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:repeat(11,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:3px}
 .key{height:100%;min-height:0;min-width:0;width:100%;padding:0;font-size:clamp(19px,5.5vw,27px);font-weight:900;color:#0874dc;border-radius:7px;touch-action:manipulation}
 .key.action{font-size:clamp(13px,3.7vw,18px)}
 .blank{display:block;visibility:hidden}
 .one-tone-wrap{grid-column:2 / span 7;min-width:0;min-height:0}
 .one-tone{height:100%;min-height:0}
 .one-tone-dot{width:clamp(26px,5vh,44px);height:clamp(26px,5vh,44px)}
 footer{flex:0 0 auto;font-size:clamp(11px,1.7vh,14px);padding:1px 0}
}
@media(max-width:600px) and (max-height:650px){
 .panel{padding:4px 6px 2px}
 .label{margin:2px 0}
 .fav{padding:2px 1px}
 .keyboard{padding:3px}
 #keys{gap:2px}
}
</style>
</head>
<body>
<main>
<section class="panel">
 <div class="top">
   <div id="sentence">請用下方注音開始輸入…</div>
   <button id="speak" class="big" aria-label="播放句子">🔊</button>
   <button id="clear" class="big">清除</button>
 </div>
 <div class="label">常用語（長按一格即可儲存目前句子）</div>
 <div id="favorites"></div>
 <div id="compose"></div>
 <div id="cands"></div>
</section>
<section class="keyboard"><div id="keys"></div></section>
<footer>國立臺南大學特教系 臧永佳 AI設計開發</footer>
</main>
<script src="./zhuyin-dictionary.js?v=14.8"></script>
<script src="./app.js?v=14.8"></script>
<div style="text-align:center;font-size:12px;color:#777;margin:6px 0 12px">字音資料：教育部《國語辭典簡編本》（2026-09-29）；注音發音：教育部《國語注音符號手冊》（CC BY 4.0）</div>
</body>
</html>
